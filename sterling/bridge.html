<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sterling Bridge</title></head>
<body style="font-family:-apple-system,sans-serif;background:#071424;color:#fff;padding:18px">
<div id="s">Connecting Sterling to the active route…</div>
<script>
(function(){
  const out=document.getElementById('s');
  const q=new URLSearchParams(location.search);
  const token=q.get('token')||'';
  const target=q.get('origin')||'';
  const allowed=target==='https://win.iclportal.com';
  function send(){
    try{
      if(!allowed||!token){out.textContent='This bridge request is not valid.';return;}
      const raw=localStorage.getItem('sterling.pending.v2')||localStorage.getItem('sterling.pending.v1');
      if(!raw){out.textContent='No confirmed Sterling customer packet is saved on this device.';return;}
      const packet=JSON.parse(raw);
      if(packet.expiresAt&&Number(packet.expiresAt)<Date.now()){
        localStorage.removeItem('sterling.pending.v2');
        out.textContent='The saved Sterling packet expired. Reconfirm the customer in Sterling.';
        return;
      }
      if(!window.opener){out.textContent='Open this bridge from Sterling Helper on the active Salesforce/ICL page.';return;}
      window.opener.postMessage({type:'STERLING_ROUTE_PACKET_V2',token,packet},target);
      localStorage.removeItem('sterling.pending.v2');
      out.textContent='Customer packet transferred to the active route. You can close this window.';
      setTimeout(()=>window.close(),650);
    }catch(e){out.textContent='Sterling packet could not be transferred.';}
  }
  send();
})();
</script></body></html>
