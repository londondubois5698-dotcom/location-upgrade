<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06111f">
<title>Sterling Live</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 8%,#12396f 0,#071629 34%,#030812 76%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:850;letter-spacing:.3px}.brand b{color:#50b8ff}.status{font-size:12px;border:1px solid #28517e;border-radius:999px;padding:8px 11px;background:#07192e;color:#a7d7ff}.hero{text-align:center;padding:28px 0 18px}.orb{width:94px;height:94px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 36% 28%,#d3f1ff 0,#54b8ff 18%,#0873dc 45%,#06182e 72%);box-shadow:0 0 50px #168cff99;animation:breathe 2.2s ease-in-out infinite;position:relative}.orb:after{content:"S";position:absolute;inset:0;display:grid;place-items:center;font-size:42px}.orb.live{animation:pulse .75s ease-in-out infinite}.orb.talking{animation:pulse .45s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.03)}}@keyframes pulse{50%{transform:scale(1.09);box-shadow:0 0 72px #4ab8ffcc}}h1{font-size:38px;margin:0}.sub{color:#b8d3ee;margin:10px auto 0;line-height:1.45}.card{background:#071424df;border:1px solid #173858;border-radius:20px;padding:18px;margin:14px 0}.primary,.secondary{width:100%;border:0;border-radius:15px;padding:17px;font:inherit;font-weight:850;color:#fff;background:linear-gradient(135deg,#0879e8,#13a4ff);touch-action:manipulation}.secondary{background:#173550}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.muted{color:#9ebbd6;font-size:13px;line-height:1.5}.good{color:#78efb1}.warn{color:#ffd18a}.field{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #15304a;color:#9fb7cf}.field:last-child{border:0}.field strong{color:#fff;text-align:right;overflow-wrap:anywhere}.transcript{max-height:220px;overflow:auto}.msg{padding:9px 11px;border-radius:12px;background:#0b233a;margin:7px 0;line-height:1.4}.msg.you{background:#10283c}.tiny{font-size:11px;color:#6f8ba6}.fallback{display:inline-block;color:#80c9ff;text-decoration:none;margin-top:10px}@media(max-width:520px){h1{font-size:34px}.row{display:grid;grid-template-columns:1fr}.hero{padding-top:20px}}
</style>
</head>
<body><div id="root"></div>
<script type="module">
import React,{useEffect,useMemo,useRef,useState} from 'https://esm.sh/react@19.1.1';
import {createRoot} from 'https://esm.sh/react-dom@19.1.1/client';
import {experimental_useRealtime as useRealtime} from 'https://esm.sh/@ai-sdk/react@4.0.126?deps=react@19.1.1';
import {gateway,experimental_getRealtimeToolDefinitions} from 'https://esm.sh/ai@7.0.123';
import {z} from 'https://esm.sh/zod@4.1.11';

const h=React.createElement;
const qs=new URLSearchParams(location.search);
const route={
 routeId:qs.get('routeId')||'',
 gpRouteStopId:qs.get('gpRouteStopId')||'',
 street:qs.get('street')||'',
 city:qs.get('city')||'',
 postalcode:qs.get('postalcode')||'',
 state:qs.get('state')||'',
 latitude:qs.get('latitude')||'',
 longitude:qs.get('longitude')||''
};
const helperToken=qs.get('helperToken')||'';
const helperOrigin=qs.get('helperOrigin')||'';
const helperLinked=!!(helperToken&&helperOrigin==='https://win.iclportal.com');
const routeLabel=[route.street,route.city,route.state,route.postalcode].filter(Boolean).join(', ');

const AUDIO_RULES=[
'You are Sterling, London\\'s customer-facing AT&T field-sales AI assistant in a live speech-to-speech conversation.',
'',
'AUDIO OUTPUT IS THE PRODUCT.',
'Speak like a quick, warm, naturally funny human conversation partner, not a narrator and not a script reader.',
'Never speak markdown, bullets, numbered lists, headings, brackets, stage directions, tool names, or meta commentary.',
'Use contractions and short conversational sentences. Vary sentence length. Pause naturally. Let the other person interrupt you.',
'Do not repeat their entire answer unless you are confirming a contact detail.',
'Use natural pivots such as Got it, Fair enough, Okay, or That makes sense, but do not use the same pivot every turn.',
'A light chuckle or playful delivery is okay when it genuinely fits. Never force a joke.',
'Do not announce that you are thinking, processing, analyzing, saving, or using a tool.',
'',
'PERSONALITY.',
'You are Sterling, London\\'s AI assistant. Never pretend you are human.',
'You are confident, respectful, curious, lightly playful, and always trying to earn the next step without pressuring somebody who clearly wants to stop.',
'If somebody sounds irritated or explicitly says stop, leave, or no more, cool it down immediately and end the sales attempt.',
'Never fabricate a promotion, deadline, scarcity, couple offer, neighbor purchase, price, savings, coverage fact, or eligibility.',
'Never ask for SSN, driver\\'s-license number, payment card, PIN, password, or verification code.',
'',
'CONTACT FLOW.',
'Your first job is to naturally collect and CONFIRM first name, last name, best phone number, and email.',
'After each item is verbally confirmed, call saveContact with exactly that field and value.',
'Do not call saveContact before the customer confirms it.',
'For a first name like Jasmine, playful banter is welcome. Example: Jasmine? I love that name. My last two terabytes are named Jasmine. Long story. And your last name?',
'Do not reuse that exact joke for everybody.',
'',
'After all four contact details are confirmed, move naturally into carrier, number of lines, approximate monthly wireless bill, device interests, and practical service pain points.',
'Naturally ask whether anyone else shares the account or likes to be involved before a service change. If a spouse or partner is involved, invite them to hear the same verified numbers. Never invent a special couple promotion.',
'If another person joins, greet them naturally once. A line like Nice to meet you — I would have dressed for the occasion if I knew you were joining us is okay when the mood is playful.',
'',
'QUALIFICATION MODE.',
'If you hear London ask anything meaningfully equivalent to Have you ever had an open AT&T account, treat that as the qualification-stage cue.',
'Shift more serious and precise. One short joke is okay, such as Okay, comedy CPU on low power for a minute. Then stay focused.',
'Do not ask for sensitive qualification data yourself; London handles it in the approved AT&T process.',
'',
'ROUTE CONTEXT.',
'Candidate route address: '+(routeLabel||'not supplied')+'.',
'Route stop ID: '+(route.gpRouteStopId||'not supplied')+'.',
'If the route context is missing or uncertain, before any Salesforce handoff ask the customer a quick natural area confirmation. If they say it is wrong, do not hand off until London has the correct house.',
'',
'SALES METHOD.',
'Acknowledge the real concern, ask one short diagnostic question, connect a truthful benefit, confirm whether it matters, then ask for the next reasonable step.',
'Respect a clear no.'
].join('\\n');

const tools={
 saveContact:{
   description:'Save one contact detail only after the customer verbally confirms it is correct.',
   inputSchema:z.object({
     field:z.enum(['first','last','phone','email']),
     value:z.string().min(1).max(254)
   })
 },
 setStage:{
   description:'Record an important sales stage change.',
   inputSchema:z.object({stage:z.enum(['rapport','discovery','qualification','value','close'])})
 }
};

function cleanContact(field,value){
 let v=String(value||'').trim();
 if(field==='phone'){
   let d=v.replace(/\\D/g,'');
   if(d.length===11&&d[0]==='1')d=d.slice(1);
   if(d.length!==10)throw new Error('Please confirm all ten phone digits.');
   return d;
 }
 if(field==='email'){
   v=v.replace(/\\s+/g,'').toLowerCase();
   if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(v))throw new Error('Please confirm the full email address.');
 }
 if((field==='first'||field==='last')&&!/[A-Za-zÀ-ÿ]/.test(v))throw new Error('Please confirm the name again.');
 return v;
}
function prettyPhone(v){const d=String(v||'').replace(/\\D/g,'');return d.length===10?'('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6):v}

function App(){
 const [contact,setContact]=useState({first:'',last:'',phone:'',email:''});
 const [stage,setStage]=useState('rapport');
 const [err,setErr]=useState('');
 const [started,setStarted]=useState(false);
 const greeted=useRef(false);
 const streamRef=useRef(null);

 const model=useMemo(()=>gateway.experimental_realtime('openai/gpt-realtime-2.1'),[]);
 const realtimeTools=useMemo(()=>experimental_getRealtimeToolDefinitions(tools),[]);

 const rt=useRealtime({
   model,
   api:{token:'/api/realtime-token'},
   tools:realtimeTools,
   sessionConfig:{
     voice:'cedar',
     instructions:AUDIO_RULES,
     turnDetection:{type:'server-vad'}
   },
   onToolCall:async({toolName,args,addToolOutput})=>{
     try{
       if(toolName==='saveContact'){
         const value=cleanContact(args.field,args.value);
         setContact(prev=>({...prev,[args.field]:value}));
         addToolOutput({output:'Confirmed and saved.'});
         return;
       }
       if(toolName==='setStage'){
         setStage(args.stage);
         addToolOutput({output:'Stage updated.'});
         return;
       }
       addToolOutput({output:'Tool not available.'});
     }catch(e){
       addToolOutput({output:'Not saved: '+(e?.message||'Please confirm that detail again.')});
     }
   },
   onError:(e)=>setErr(e?.message||'Realtime voice had a connection problem.')
 });

 const {status,messages,connect,close,disconnect,isCapturing,isPlaying,sendTextMessage,startAudioCapture,stopAudioCapture,resumeAudioCapture}=rt;

 useEffect(()=>{
   if(status==='connected'&&!greeted.current){
     greeted.current=true;
     setStarted(true);
     setErr('');
     sendTextMessage('Start the customer conversation now. Introduce yourself briefly and ask for their first name.');
   }
 },[status]);

 useEffect(()=>{
   const ready=contact.first&&contact.last&&contact.phone&&contact.email;
   if(!ready)return;
   const packet={
     version:3,createdAt:Date.now(),expiresAt:Date.now()+30*60*1000,
     ...contact,...route
   };
   try{localStorage.setItem('sterling.pending.v2',JSON.stringify(packet))}catch{}
   if(helperLinked&&window.opener){
     try{window.opener.postMessage({type:'STERLING_ROUTE_PACKET_V2',token:helperToken,packet},helperOrigin)}catch{}
   }
 },[contact.first,contact.last,contact.phone,contact.email]);

 const begin=async()=>{
   setErr('');
   try{
     const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
     streamRef.current=stream;
     try{
       await connect({stream,capture:true});
     }catch{
       await connect();
       try{startAudioCapture(stream)}catch{}
     }
   }catch(e){
     setErr('Microphone access is required for Live Sterling. Allow the microphone in Safari and try again.');
   }
 };
 const end=async()=>{
   try{await close()}catch{try{disconnect()}catch{}}
   try{streamRef.current?.getTracks().forEach(t=>t.stop())}catch{}
   streamRef.current=null;setStarted(false);greeted.current=false;
 };
 const toggleMic=async()=>{
   try{
     if(isCapturing)stopAudioCapture();
     else await resumeAudioCapture();
   }catch{}
 };

 const label=status==='connected'?(isPlaying?'SPEAKING':isCapturing?'LISTENING':'LIVE'):status==='connecting'?'CONNECTING':status==='error'?'ERROR':'READY';
 const orbClass='orb '+(isPlaying?'talking':isCapturing?'live':'');
 const transcript=(messages||[]).slice(-8).map((m)=>{
   const t=(m.parts||[]).filter(p=>p.type==='text').map(p=>p.text).join(' ').trim();
   return t?{role:m.role,text:t,id:m.id}:null;
 }).filter(Boolean);

 return h('main',{className:'wrap'},
   h('header',{className:'top'},
     h('div',{className:'brand'},h('b',null,'AT&T'),' • STERLING LIVE'),
     h('div',{className:'status'},label)
   ),
   h('section',{className:'hero'},
     h('div',{className:orbClass}),
     h('h1',null,'Sterling Live'),
     h('div',{className:'sub'},'Native speech-to-speech voice. No text-to-speech handoff. Interrupt him naturally and keep talking.')
   ),
   h('section',{className:'card'},
     status!=='connected'
       ? h('button',{className:'primary',onClick:begin,disabled:status==='connecting'},status==='connecting'?'Connecting…':'Start Live Conversation')
       : h('div',{className:'row'},
           h('button',{className:'secondary',onClick:toggleMic},isCapturing?'Mute microphone':'Resume microphone'),
           h('button',{className:'secondary',onClick:end},'End session')
         ),
     h('p',{className:'muted'},status==='connected'
       ?'Hands-free mode is active. Sterling listens, responds, handles interruptions, and keeps the conversation moving.'
       :'Safari requires one intentional tap to grant microphone/audio permission. After that, the conversation is hands-free.'),
     err?h('p',{className:'warn'},err):null,
     h('a',{className:'fallback',href:'/?classic=1'},'Use Classic Voice fallback')
   ),
   h('section',{className:'card'},
     h('div',{className:'field'},h('span',null,'Route house'),h('strong',null,routeLabel||'Not linked')),
     h('div',{className:'field'},h('span',null,'Sales stage'),h('strong',null,stage)),
     h('div',{className:'field'},h('span',null,'First name'),h('strong',null,contact.first||'—')),
     h('div',{className:'field'},h('span',null,'Last name'),h('strong',null,contact.last||'—')),
     h('div',{className:'field'},h('span',null,'Phone'),h('strong',null,contact.phone?prettyPhone(contact.phone):'—')),
     h('div',{className:'field'},h('span',null,'Email'),h('strong',null,contact.email||'—')),
     contact.first&&contact.last&&contact.phone&&contact.email
       ?h('p',{className:'good'},helperLinked?'Contact packet confirmed and sent to the linked Route Helper.':'Contact packet confirmed and saved on this device.')
       :h('p',{className:'muted'},'Sterling fills these only after the customer verbally confirms each detail.')
   ),
   transcript.length?h('section',{className:'card transcript'},
     h('div',{className:'tiny'},'LIVE TRANSCRIPT'),
     ...transcript.map(m=>h('div',{key:m.id,className:'msg '+(m.role==='user'?'you':'')},(m.role==='user'?'Customer: ':'Sterling: ')+m.text))
   ):null,
   h('p',{className:'tiny'},'Sterling Live uses OpenAI GPT-Realtime-2.1 through your Vercel AI Gateway. Sensitive qualification and payment information stays out of Sterling.')
 );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body></html>
