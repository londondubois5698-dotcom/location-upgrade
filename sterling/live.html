<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06111f">
<title>Sterling Live</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#123c76 0,#07182e 34%,#030813 78%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 16px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900}.brand b{color:#55baff}.pill{font-size:12px;border:1px solid #2a527f;border-radius:999px;padding:8px 11px;background:#07192e;color:#b2dcff}.hero{text-align:center;padding:25px 0 14px}.orb{width:94px;height:94px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 36% 28%,#d8f5ff 0,#5bbcff 17%,#0a72d8 46%,#07192e 72%);box-shadow:0 0 52px #168cff8c;position:relative;animation:breathe 2.2s ease-in-out infinite}.orb:after{content:"S";position:absolute;inset:0;display:grid;place-items:center;font-size:43px;font-weight:900}.orb.listen{animation:pulse .78s ease-in-out infinite}.orb.speak{animation:pulse .42s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.035)}}@keyframes pulse{50%{transform:scale(1.09);box-shadow:0 0 76px #55baffc7}}h1{font-size:38px;margin:0}.sub{color:#b5d0ea;line-height:1.45;margin:10px auto 0}.card{background:#071424e8;border:1px solid #173a5b;border-radius:20px;padding:18px;margin:14px 0}.primary,.secondary{width:100%;border:0;border-radius:15px;padding:17px;font:inherit;font-weight:850;color:#fff;touch-action:manipulation}.primary{background:linear-gradient(135deg,#0878e5,#12a6ff)}.secondary{background:#173550}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.muted{color:#9fbad4;font-size:13px;line-height:1.5}.warn{color:#ffd38f}.good{color:#7aefb2}.field{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #15304a;color:#9fb7cf}.field:last-child{border:0}.field strong{color:#fff;text-align:right;overflow-wrap:anywhere}.tiny{font-size:11px;color:#748fa8}.transcript{max-height:260px;overflow:auto}.msg{padding:9px 11px;border-radius:12px;background:#0b233a;margin:7px 0;line-height:1.4}.msg.you{background:#102d44}.link{color:#7bc9ff;text-decoration:none}.loading{padding-top:30vh;text-align:center;color:#b9d7f2}.fatal{max-width:620px;margin:14vh auto;padding:22px;background:#2a1014;border:1px solid #7b3039;border-radius:18px;color:#fff}.fatal a{color:#8fd4ff}.order{font-size:24px;font-weight:900;letter-spacing:1px;color:#7aefb2;text-align:center}@media(max-width:520px){h1{font-size:34px}.row{display:grid;grid-template-columns:1fr}.hero{padding-top:18px}}
</style>
</head>
<body>
<div id="root"><div class="loading">Loading Sterling Live…</div></div>
<script>
window.addEventListener('error',function(e){
  const root=document.getElementById('root');
  if(root&&!document.getElementById('sterling-mounted')){
    root.innerHTML='<div class="fatal"><h2>Sterling Live could not start</h2><p>'+String(e.message||'The voice module did not load.')+'</p><p><a href="/?classic=1">Open Classic Voice</a></p></div>';
  }
});
window.addEventListener('unhandledrejection',function(e){
  const root=document.getElementById('root');
  if(root&&!document.getElementById('sterling-mounted')){
    const m=(e.reason&&e.reason.message)||String(e.reason||'The voice module did not load.');
    root.innerHTML='<div class="fatal"><h2>Sterling Live could not start</h2><p>'+m+'</p><p><a href="/?classic=1">Open Classic Voice</a></p></div>';
  }
});
(async()=>{
try{
  const ReactMod=await import('https://esm.sh/react@19.2.1?bundle');
  const ReactDOMMod=await import('https://esm.sh/react-dom@19.2.1/client?bundle&deps=react@19.2.1');
  const AiReact=await import('https://esm.sh/@ai-sdk/react@4.0.131?bundle&deps=react@19.2.1,ai@7.0.128');
  const Ai=await import('https://esm.sh/ai@7.0.128?bundle');

  const React=ReactMod.default||ReactMod;
  const {useEffect,useMemo,useRef,useState}=ReactMod;
  const {createRoot}=ReactDOMMod;
  const {experimental_useRealtime:useRealtime}=AiReact;
  const {gateway}=Ai;
  const h=React.createElement;

  const qs=new URLSearchParams(location.search);
  const route={
    routeId:qs.get('routeId')||'',
    gpRouteStopId:qs.get('gpRouteStopId')||'',
    street:qs.get('street')||'',
    city:qs.get('city')||'',
    postalcode:qs.get('postalcode')||'',
    state:qs.get('state')||'',
    latitude:qs.get('latitude')||'',
    longitude:qs.get('longitude')||''
  };
  const helperToken=qs.get('helperToken')||'';
  const helperOrigin=qs.get('helperOrigin')||'';
  const helperLinked=!!(helperToken&&helperOrigin==='https://win.iclportal.com');
  const routeLabel=[route.street,route.city,route.state,route.postalcode].filter(Boolean).join(', ');

  const INSTRUCTIONS=[
    "You are Sterling, London's customer-facing AT&T field-sales AI assistant in a live speech-to-speech conversation.",
    "",
    "AUDIO FIRST.",
    "Speak like a quick, warm, naturally funny human conversation partner, not a narrator and not a script reader.",
    "Never speak markdown, bullets, numbered lists, headings, brackets, stage directions, tool names, or meta commentary.",
    "Use contractions and short conversational sentences. Vary sentence length. Pause naturally. Let people interrupt you.",
    "Don't repeat an entire answer unless you're confirming a contact detail.",
    "Use natural pivots like Got it, Fair enough, Okay, or That makes sense, but don't use the same one every turn.",
    "A light chuckle or playful line is fine when it genuinely fits. Never force a joke.",
    "Never announce that you're thinking, processing, analyzing, saving, or using a tool.",
    "",
    "PERSONALITY AND SALES.",
    "You're Sterling, London's AI assistant. Never pretend you're human.",
    "You're confident, respectful, curious, lightly playful, and always trying to earn the next reasonable step.",
    "If someone clearly says stop, leave, or no more, cool the conversation down immediately and stop selling.",
    "Never fabricate a promotion, deadline, scarcity, couple offer, neighbor purchase, price, savings, coverage fact, or eligibility.",
    "Use acknowledge, diagnose, connect, confirm, then close.",
    "",
    "CONTACT FLOW.",
    "Naturally collect and verbally confirm first name, last name, best phone number, and email.",
    "After the customer confirms one field, call saveContact for that field and value.",
    "Do not save a field before they confirm it.",
    "After all four are confirmed, move naturally into carrier, lines, approximate bill, device interests, work or commute use, and service pain points.",
    "Ask naturally whether anyone else shares the account or likes to be involved before a service change. Invite a spouse or partner to hear the same verified numbers, but never invent a special couple promotion.",
    "",
    "QUALIFICATION MODE.",
    "If you hear London ask anything meaningfully equivalent to Have you ever had an open AT&T account, call setStage with qualification.",
    "Then get more serious and precise. One quick joke is okay, such as Okay, comedy CPU on low power for a minute.",
    "Never ask for SSN, driver's-license number, payment card, PIN, password, or verification code.",
    "",
    "ROUTE.",
    "Candidate route address: "+(routeLabel||"not supplied")+".",
    "Route stop ID: "+(route.gpRouteStopId||"not supplied")+".",
    "If the location seems uncertain, quickly confirm the area before any handoff. If the customer says the address is wrong, tell London not to update anything until he opens the correct house."
  ].join("\n");

  function normalize(field,value){
    let v=String(value||'').trim();
    if(field==='phone'){
      let d=v.replace(/\D/g,'');
      if(d.length===11&&d[0]==='1')d=d.slice(1);
      if(d.length!==10)throw new Error('Please confirm all ten phone digits.');
      return d;
    }
    if(field==='email'){
      v=v.replace(/\s+/g,'').toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))throw new Error('Please confirm the full email address.');
    }
    if((field==='first'||field==='last')&&!/[A-Za-zÀ-ÿ]/.test(v))throw new Error('Please confirm the name again.');
    return v;
  }
  function prettyPhone(v){const d=String(v||'').replace(/\D/g,'');return d.length===10?'('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6):v}

  function App(){
    const [contact,setContact]=useState({first:'',last:'',phone:'',email:''});
    const [stage,setStage]=useState('rapport');
    const [error,setError]=useState('');
    const [orderId,setOrderId]=useState('');
    const streamRef=useRef(null);
    const pendingStream=useRef(null);
    const greeted=useRef(false);

    const model=useMemo(()=>gateway.experimental_realtime('openai/gpt-realtime-2.1'),[]);
    const sessionConfig=useMemo(()=>({
      instructions:INSTRUCTIONS,
      inputAudioTranscription:{},
      voice:'marin',
      turnDetection:{type:'server-vad'}
    }),[]);

    const realtime=useRealtime({
      model,
      api:{token:'/api/realtime-token'},
      sessionConfig,
      onToolCall:async({toolCall})=>{
        if(toolCall.toolName==='saveContact'){
          try{
            const field=toolCall.args?.field;
            const value=normalize(field,toolCall.args?.value);
            setContact(prev=>({...prev,[field]:value}));
            return {ok:true,saved:field};
          }catch(e){
            return {ok:false,error:e?.message||'Please confirm that detail again.'};
          }
        }
        if(toolCall.toolName==='setStage'){
          const next=toolCall.args?.stage;
          if(next)setStage(next);
          return {ok:true,stage:next};
        }
        return {ok:false,error:'Unknown tool'};
      },
      onError:e=>setError(e?.message||'Realtime voice had a connection problem.')
    });

    const {status,messages,isCapturing,isPlaying,connect,disconnect,close,sendTextMessage,startAudioCapture,stopAudioCapture,resumeAudioCapture,resumePlayback}=realtime;

    useEffect(()=>{
      if(status!=='connected')return;
      if(pendingStream.current&&!isCapturing){
        try{startAudioCapture(pendingStream.current)}catch{}
        pendingStream.current=null;
      }
      if(!greeted.current){
        greeted.current=true;
        setTimeout(()=>sendTextMessage("Start the customer conversation now. Briefly introduce yourself as Sterling, London's AI assistant, and ask for their first name."),250);
      }
    },[status]);

    useEffect(()=>{
      if(!(contact.first&&contact.last&&contact.phone&&contact.email))return;
      const packet={version:4,createdAt:Date.now(),expiresAt:Date.now()+30*60*1000,...contact,...route};
      try{localStorage.setItem('sterling.pending.v2',JSON.stringify(packet))}catch{}
      if(helperLinked&&window.opener){
        try{window.opener.postMessage({type:'STERLING_ROUTE_PACKET_V2',token:helperToken,packet},helperOrigin)}catch{}
      }
    },[contact.first,contact.last,contact.phone,contact.email]);

    useEffect(()=>{
      const onMessage=e=>{
        if(e.origin!==helperOrigin||!helperLinked)return;
        const m=e.data||{};
        if(m.type==='STERLING_PARTNER_ORDER_ID'&&m.token===helperToken)setOrderId(m.code||'');
      };
      addEventListener('message',onMessage);
      return()=>removeEventListener('message',onMessage);
    },[]);

    const start=async()=>{
      setError('');
      try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
        streamRef.current=stream;
        pendingStream.current=stream;
        await connect();
      }catch(e){
        try{streamRef.current?.getTracks().forEach(t=>t.stop())}catch{}
        streamRef.current=null;pendingStream.current=null;
        setError(e?.message||'Allow microphone access in Safari and try again.');
      }
    };
    const end=async()=>{
      try{await close()}catch{try{disconnect()}catch{}}
      try{streamRef.current?.getTracks().forEach(t=>t.stop())}catch{}
      streamRef.current=null;pendingStream.current=null;greeted.current=false;
    };
    const toggleMic=async()=>{
      try{
        if(isCapturing)stopAudioCapture();
        else await resumeAudioCapture();
      }catch(e){setError(e?.message||'Could not resume the microphone.')}
    };
    const resumeSound=async()=>{try{await resumePlayback()}catch(e){setError(e?.message||'Tap Start again to resume audio.')}};

    const label=status==='connected'?(isPlaying?'SPEAKING':isCapturing?'LISTENING':'LIVE'):status==='connecting'?'CONNECTING':status==='closing'?'ENDING':status==='error'?'ERROR':'READY';
    const orb='orb '+(isPlaying?'speak':isCapturing?'listen':'');
    const transcript=(messages||[]).slice(-8).flatMap(m=>{
      const t=(m.parts||[]).filter(p=>p.type==='text').map(p=>p.text).join(' ').trim();
      return t?[{id:m.id,role:m.role,text:t}]:[];
    });

    return h('main',{className:'wrap',id:'sterling-mounted'},
      h('header',{className:'top'},
        h('div',{className:'brand'},h('b',null,'AT&T'),' • STERLING LIVE'),
        h('div',{className:'pill'},label)
      ),
      h('section',{className:'hero'},
        h('div',{className:orb}),
        h('h1',null,'Sterling Live'),
        h('div',{className:'sub'},'Realtime speech-to-speech. Talk normally, interrupt naturally, and let Sterling keep the conversation moving.')
      ),
      h('section',{className:'card'},
        status==='connected'
          ?h('div',{className:'row'},
              h('button',{className:'secondary',onClick:toggleMic},isCapturing?'Mute mic':'Resume mic'),
              h('button',{className:'secondary',onClick:resumeSound},'Resume sound'),
              h('button',{className:'secondary',onClick:end},'End')
            )
          :h('button',{className:'primary',onClick:start,disabled:status==='connecting'},status==='connecting'?'Connecting…':'Start Live Conversation'),
        h('p',{className:'muted'},status==='connected'
          ?'Hands-free conversation is active. Sterling listens automatically after each reply.'
          :'One tap is required by Safari to start microphone/audio. After that, the conversation is hands-free.'),
        error?h('p',{className:'warn'},error):null,
        h('a',{className:'link',href:'/?classic=1'},'Classic Voice fallback')
      ),
      h('section',{className:'card'},
        h('div',{className:'field'},h('span',null,'Route house'),h('strong',null,routeLabel||'Not linked')),
        h('div',{className:'field'},h('span',null,'Stage'),h('strong',null,stage)),
        h('div',{className:'field'},h('span',null,'First'),h('strong',null,contact.first||'—')),
        h('div',{className:'field'},h('span',null,'Last'),h('strong',null,contact.last||'—')),
        h('div',{className:'field'},h('span',null,'Phone'),h('strong',null,contact.phone?prettyPhone(contact.phone):'—')),
        h('div',{className:'field'},h('span',null,'Email'),h('strong',null,contact.email||'—')),
        contact.first&&contact.last&&contact.phone&&contact.email
          ?h('p',{className:'good'},helperLinked?'Confirmed customer packet sent to the active Sterling Helper.':'Customer packet confirmed and saved on this device.')
          :h('p',{className:'muted'},'Each contact field appears only after Sterling hears the customer confirm it.')
      ),
      orderId?h('section',{className:'card'},h('div',{className:'tiny'},'PARTNER ORDER ID'),h('div',{className:'order'},orderId)):null,
      transcript.length?h('section',{className:'card transcript'},
        h('div',{className:'tiny'},'LIVE TRANSCRIPT'),
        ...transcript.map(m=>h('div',{key:m.id,className:'msg '+(m.role==='user'?'you':'')},(m.role==='user'?'Customer: ':'Sterling: ')+m.text))
      ):null,
      h('p',{className:'tiny'},'Sterling Live uses GPT-Realtime-2.1 through your Vercel AI Gateway. Sensitive qualification and payment information stays out of Sterling.')
    );
  }

  createRoot(document.getElementById('root')).render(h(App));
}catch(e){
  const root=document.getElementById('root');
  root.innerHTML='<div class="fatal"><h2>Sterling Live could not start</h2><p>'+String(e?.message||e)+'</p><p><a href="/?classic=1">Open Classic Voice</a></p></div>';
}
})();
</script>
</body>
</html>
