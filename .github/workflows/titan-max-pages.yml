name: Build Titan Max GitHub Site
on:
  push:
    branches: [main]
    paths:
      - 'titan-max/**'
      - '.github/workflows/titan-max-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: titan-max-build
  cancel-in-progress: true

jobs:
  build-and-publish-folder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Titan dependencies
        run: npm install --prefix titan-max
      - name: Build Titan Max
        run: npm run build --prefix titan-max
      - name: Publish compiled app into branch Pages folder
        run: |
          rm -rf titan-live
          mkdir -p titan-live
          cp -R titan-max/dist/. titan-live/
          touch titan-live/.nojekyll
      - name: Commit compiled Titan Max
        run: |
          git config user.name "Titan Max Builder"
          git config user.email "actions@users.noreply.github.com"
          git add titan-live
          if git diff --cached --quiet; then
            echo "Titan Max compiled output is already current."
            exit 0
          fi
          git commit -m "Publish Titan Max compiled GitHub site [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
