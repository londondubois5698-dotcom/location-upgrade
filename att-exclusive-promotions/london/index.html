<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061522"><title>London · Local Appointment Inbox</title><style>body{margin:0;background:#061522;color:#eefaff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:760px;margin:auto;padding:24px 14px}h1{letter-spacing:-.04em}.note{color:#9eb9c8;line-height:1.5}.card{border:1px solid #285169;border-radius:16px;background:#0a2231;padding:14px;margin:10px 0}.card b{font-size:17px}.meta{font-size:12px;color:#a9c5d4;line-height:1.55;margin-top:7px}.btn{border:1px solid #2d637e;background:#0c2d40;color:#fff;border-radius:12px;padding:11px 14px;font-weight:900}.danger{border-color:#763a45}.empty{padding:40px;text-align:center;color:#8ca8b7;border:1px dashed #2a5268;border-radius:16px}</style></head><body><div class="w"><a href="../" style="color:#83e7ff">← Customer site</a><h1>London · local appointment inbox</h1><p class="note">This view only shows requests prepared on this same browser/device. It is not a cloud inbox and does not receive texts automatically.</p><button class="btn danger" id="clear">Clear local list</button><div id="list"></div></div><script>(()=>{const L='londonAttAppointments',el=document.querySelector('#list');function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let a=[];try{a=JSON.parse(localStorage.getItem(L)||'[]')}catch{}el.innerHTML=a.length?a.map(x=>'<div class="card"><b>'+esc(x.name)+' · '+esc(x.day)+' '+esc(x.time)+'</b><div class="meta">'+esc(x.city)+' · '+esc(x.language)+' · '+esc(x.lines)+' line(s)<br>Provider: '+esc(x.provider)+'<br>Phone: '+esc(x.phone)+(x.wheel?'<br>Wheel: '+esc(x.wheel):'')+'<br>Prepared: '+esc(new Date(x.createdAt).toLocaleString())+'</div></div>').join(''):'<div class="empty">No appointment requests have been prepared on this device yet.</div>'}document.querySelector('#clear').onclick=()=>{if(confirm('Clear this device’s local appointment list?')){localStorage.removeItem(L);render()}};render()})()</script></body></html>
